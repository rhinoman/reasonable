[workspace]
members = [
    "lib",
    "cli",
    "python"
]
resolver = "2"

[workspace.package]
version = "0.3.0-a1"
authors = ["Gabe Fierro <gtfierro@mines.edu>"]
repository = "https://github.com/gtfierro/reasonable"
homepage = "https://brickschema.org/"
#license-file = "LICENSE"
license = "BSD-3-Clause"
readme = "README.md"
description = "An OWL 2 RL reasoner with reasonable performance"
edition = "2021"
#build = "build.rs"

[workspace.dependencies]
rdf = "0.1.4"
rio_turtle = "0.8.5"
rio_api = "0.8.5"
oxrdf = { version = "0.3.0-beta.2", features = ["rdf-12"] }
farmhash = "1.1.5"
datafrog = "2.0.1"
roaring = "0.5.2"
itertools = "0.8"
disjoint-sets = "0.4.2"
log = "0.4"
env_logger = "0.7.1"
regex = "1.3.9"
serde = "1.0"
serde_json = "1.0"
serde_derive = "1.0"
tinytemplate = "1.2.1"
anyhow = "1.0.60"
reasonable = { path = "lib", version = "0.3.0-a1" }
clap = { version = "4.3.10", features = ["derive"] }

[profile.release]
debug = true
